<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foliar — Panel de Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-deep: #0a1128;
            --azul-soft: #1c2541;
            --teal-brand: #1a8fa0;
            --teal-light: #2ab5cc;
            --accent: #4cc9f0;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --texto-puro: #f8f9fa;
            --texto-muted: #a0a0c0;
            --radio: 16px;
            --shadow-lux: 0 20px 40px rgba(0,0,0,0.4);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            font-family:'Open Sans',sans-serif; 
            background-color: var(--azul-deep);
            background-image: radial-gradient(circle at 50% 0%, #162a5a 0%, #0a1128 70%);
            color: var(--texto-puro); 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- SPLASH SCREEN ELITE --- */
        #loading {
            position:fixed; inset:0;
            background: var(--azul-deep);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            z-index:9999; transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #loading.hide { opacity:0; pointer-events:none; }
        #loading img {
            width: 500px;
            max-width: 85vw;
            filter: drop-shadow(0 0 30px rgba(42, 181, 204, 0.3));
            animation: pulse-logo 2s infinite ease-in-out;
        }
        @keyframes pulse-logo {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 30px rgba(42, 181, 204, 0.3)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 50px rgba(42, 181, 204, 0.5)); }
        }

        /* --- HEADER GLASSMORPHISM --- */
        header {
            background: rgba(10, 17, 40, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            height: 85px; padding: 0 60px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }
        .hl { display:flex; align-items:center; gap:20px; }
        .hl img { height: 48px; transition: 0.3s; }
        .hl-div { width:1px; height:30px; background: var(--glass-border); }
        .hl-est { font-family: 'Montserrat'; font-weight: 700; font-size: 0.9rem; color: var(--accent); letter-spacing: 1px; }

        .hr { display:flex; align-items:center; gap:20px; }
        .bp { background: linear-gradient(90deg, var(--teal-brand), var(--teal-light)); color: #fff; padding: 6px 16px; border-radius: 50px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; border: none; box-shadow: 0 4px 15px rgba(26, 143, 160, 0.4); }
        .bout { background: transparent; border: 1px solid var(--glass-border); color: #fff; padding: 10px 22px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-size: 0.85rem; }
        .bout:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }

        /* --- HERO SECTION --- */
        .hero { padding: 60px 60px 40px; text-align: left; }
        .hero h1 { font-family: 'Montserrat'; font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--texto-muted); font-size: 1.1rem; max-width: 600px; }

        /* --- GRID & CARDS ELITE --- */
        main { max-width: 1300px; margin: 0 auto; padding: 0 60px 80px; }
        .stit { font-family: 'Montserrat'; font-size: 0.75rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--teal-light); margin-bottom: 25px; opacity: 0.8; }
        
        .grilla { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

        .card { 
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radio);
            padding: 35px 30px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        .card::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(76, 201, 240, 0.1) 0%, transparent 100%);
            opacity: 0; transition: 0.4s;
        }
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 20px rgba(76, 201, 240, 0.1);
        }
        .card:hover::before { opacity: 1; }

        .cico { 
            font-size: 2rem; margin-bottom: 20px; 
            width: 60px; height: 60px; 
            background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
            transition: 0.3s;
        }
        .card:hover .cico { transform: rotate(-10deg) scale(1.1); background: var(--accent); }
        
        .cnom { font-family: 'Montserrat'; font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 12px; }
        .cdesc { font-size: 0.9rem; color: var(--texto-muted); line-height: 1.6; }

        .card.lock { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        .bplan { 
            margin-top: 20px; background: rgba(255,255,255,0.1); color: #fff;
            border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;
            font-family: 'Montserrat'; font-size: 0.75rem; transition: 0.3s;
        }
        .bplan:hover { background: var(--texto-puro); color: var(--azul-deep); }

        footer { border-top: 1px solid var(--glass-border); padding: 40px; text-align: center; color: var(--texto-muted); font-size: 0.8rem; }
        footer b { color: var(--accent); }

        @media(max-width: 768px) {
            header { padding: 0 20px; }
            .hero, main { padding: 40px 20px; }
        }
    </style>
</head>
<body>

<div id="loading">
    <img src="logo_foliar.png" alt="Foliar">
    <div style="margin-top:20px; width:200px; height:2px; background:rgba(255,255,255,0.1); position:relative; overflow:hidden;">
        <div style="position:absolute; height:100%; width:50%; background:var(--accent); animation: load 1.5s infinite ease-in-out;"></div>
    </div>
</div>

<header>
    <div class="hl">
        <img src="logo_foliar.png" alt="Foliar">
        <div class="hl-div"></div>
        <div class="hl-est" id="h-est">ESTUDIO GARCÍA & ASOC.</div>
    </div>
    <div class="hr">
        <div class="bp" id="h-plan">Plan Pro</div>
        <button class="bout" onclick="FoliarAuth.logout()">Logout</button>
    </div>
</header>

<div class="hero">
    <h1>Bienvenida, <span id="h-nombre" style="color:var(--accent)">Doctora García</span> 👋</h1>
    <p>La infraestructura legal del futuro, hoy en tus manos. Gestioná tus casos con precisión quirúrgica.</p>
</div>

<main>
    <div class="stit">Sistemas Activos</div>
    <div class="grilla" id="grilla"></div>
</main>

<footer>
    <p>© 2026 <b>Foliar.com.ar</b> — Software de Alto Rendimiento para Abogados.</p>
</footer>

<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
const PLANILLAS = [
    { id:'juridica',   nombre:'Gestión Jurídica',       icono:'⚖️',  desc:'Control total de causas de familia y sucesiones con trazabilidad completa.', url:'planillas/juridica.html' },
    { id:'siniestros', nombre:'Módulo Siniestros',      icono:'🚗',  desc:'Liquidación de reclamos y seguimiento contra aseguradoras líderes.', url:'planillas/siniestros.html' },
    { id:'abonos',     nombre:'Control Financiero',     icono:'💰',  desc:'Automatización de cobranzas, abonos mensuales y flujo de caja.', url:'planillas/abonos.html' },
    { id:'graficos',   nombre:'Data Analytics',         icono:'📊',  desc:'Métricas en tiempo real sobre el rendimiento de tu firma.', url:'planillas/graficos.html' },
    { id:'pjn',        nombre:'Bot de Consulta PJN',    icono:'🤖',  desc:'Sincronización mediante IA de movimientos del Poder Judicial.', url:null },
    { id:'mev',        nombre:'SCBA / MEV Sync',        icono:'🔄',  desc:'Notificaciones automáticas y monitoreo de cortes provinciales.', url:null }
];

document.addEventListener('DOMContentLoaded', async () => {
    // Simulación de carga para que se vea el splash screen profesional
    setTimeout(() => {
        document.getElementById('loading').classList.add('hide');
    }, 1500);

    // En producción usarías: const { user, perfil } = await FoliarAuth.protegerPagina();
    renderGrilla();
});

function renderGrilla() {
    const g = document.getElementById('grilla');
    PLANILLAS.forEach(p => {
        const ok = (p.url !== null); // Simulación de acceso
        const el = document.createElement(ok ? 'a' : 'div');
        if (ok) el.href = p.url;
        el.className = 'card' + (ok ? '' : ' lock');
        el.innerHTML = `
            <div class="cico">${p.icono}</div>
            <div class="cnom">${p.nombre}</div>
            <div class="cdesc">${p.desc}</div>
            ${!ok ? `<button class="bplan">SOLICITAR ACCESO</button>` : ''}
        `;
        g.appendChild(el);
    });
}
</script>
<style>
    @keyframes load {
        0% { left: -100%; }
        100% { left: 100%; }
    }
</style>
</body>
</html>
