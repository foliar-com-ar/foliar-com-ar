<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foliar — Terminal Legal</title>
    <!-- Script de Iconos Profesionales (Carga Prioritaria) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a1128;
            --accent: #4cc9f0;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Open Sans', sans-serif; background: var(--bg); color: #fff; min-height: 100vh; overflow-x: hidden; }

        /* ARREGLO DEL LOGO: Crea un marco limpio para ocultar el fondo de cuadros */
        .logo-box {
            width: 50px; height: 50px;
            background: #ffffff;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.3);
        }
        .logo-box img { width: 150%; object-fit: contain; } /* Zoom para limpiar bordes */

        header {
            height: 80px; padding: 0 40px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(10, 17, 40, 0.9);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
        }
        .hl { display:flex; align-items:center; gap:15px; }
        .hl-est { font-family: 'Montserrat'; font-weight: 700; font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

        main { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .hero h1 { font-family: 'Montserrat'; font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; }
        
        .grilla { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        /* TARJETAS PROFESIONALES (SIN EMOJIS) */
        .card { 
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 30px;
            text-decoration: none;
            color: inherit;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.06);
            transform: translateY(-5px);
        }

        .icon-wrap { color: var(--accent); margin-bottom: 20px; }
        .cnom { font-family: 'Montserrat'; font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
        .cdesc { color: #a0a0c0; font-size: 0.9rem; line-height: 1.5; }

        #loading {
            position:fixed; inset:0; background: var(--bg);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            z-index:9999; transition: 0.6s ease-in-out;
        }
        #loading.hide { opacity:0; pointer-events:none; }
    </style>
</head>
<body>

<div id="loading">
    <div class="logo-box" style="width:100px; height:100px; border-radius:20px;">
        <img src="logo_foliar.png.PNG" alt="Foliar">
    </div>
    <p style="margin-top:20px; font-size:0.6rem; letter-spacing:4px; text-transform:uppercase; color:var(--accent);">Cifrando Conexión</p>
</div>

<header>
    <div class="hl">
        <div class="logo-box"><img src="logo_foliar.png.PNG" alt="Foliar"></div>
        <div class="hl-est">Estudio García & Asoc.</div>
    </div>
    <div style="background:var(--accent); color:#0a1128; padding:5px 15px; border-radius:20px; font-size:0.7rem; font-weight:800;">PRO</div>
</header>

<main>
    <div class="hero">
        <h1>Bienvenida, <span style="color:var(--accent)">Dra. García</span></h1>
    </div>

    <div class="grilla">
        <a href="planillas/juridica.html" class="card">
            <div class="icon-wrap"><i data-lucide="gavel" size="32"></i></div>
            <div class="cnom">Gestión Jurídica</div>
            <div class="cdesc">Control integral de causas, plazos y escritos judiciales.</div>
        </a>
        <a href="planillas/siniestros.html" class="card">
            <div class="icon-wrap"><i data-lucide="shield-alert" size="32"></i></div>
            <div class="cnom">Módulo Siniestros</div>
            <div class="cdesc">Liquidación y seguimiento de reclamos ante aseguradoras.</div>
        </a>
        <a href="planillas/abonos.html" class="card">
            <div class="icon-wrap"><i data-lucide="banknote" size="32"></i></div>
            <div class="cnom">Control Financiero</div>
            <div class="cdesc">Gestión de honorarios, abonos y gastos operativos.</div>
        </a>
    </div>
</main>

<script>
    // Inicialización forzada de iconos
    window.onload = function() {
        lucide.createIcons();
        setTimeout(() => {
            document.getElementById('loading').classList.add('hide');
        }, 1000);
    };
</script>
</body>
</html>
